# src/main/resources/application.properties
spring.application.name=student-management
server.port=8080

# Default: H2 in-memory for local/dev; override via env to MySQL in CI/prod
# Use DB_URL/DB_USER/DB_PASSWORD to switch to MySQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:studentdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# Optional: H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
